<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stemd</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13 3h6l7 23H6z' fill='%23ff8800'/%3E%3Cpath d='M11.4 9h9.2l1.5 5H9.9zM9.2 16.5h13.6l1.5 5H7.7z' fill='%23fff'/%3E%3Crect x='3' y='25' width='26' height='5' rx='1.5' fill='%23e06d00'/%3E%3C/svg%3E">
<style>
:root {
  --win: #f0f0f0;
  --white: #fff;
  --text: #000;
  --text2: #5a5a5a;
  --text3: #8a8a8a;
  --line: #d9d9d9;
  --line2: #adadad;
  --hover: #e5f3ff;
  --hoverline: #cce8ff;
  --sel: #cce8ff;
  --selline: #99d1ff;
  --selblur: #d9d9d9;
  --menuhover: #91c9f7;
  --accent: #0078d7;
  --orange: #ff8800;
  --green: #2e8b2e;
  --red: #c42b1c;
  --blue: #0063b1;
  --groove: #e6e6e6;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--win); color: var(--text);
  font: 12px/1.35 "Segoe UI", "Selawik", Tahoma, system-ui, sans-serif;
  overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ---- menu bar ---- */
#menubar { display: flex; background: var(--white); height: 21px; flex: none; position: relative; z-index: 20; }
.menu-title { padding: 1px 7px; height: 21px; border: 1px solid transparent; cursor: default; white-space: nowrap; }
.menu-title:hover, .menu-title.open { background: var(--hover); border-color: var(--hoverline); }
.menu-title u { text-decoration: underline; }
.popup {
  position: fixed; z-index: 100; background: #f2f2f2; border: 1px solid #ccc; padding: 2px;
  box-shadow: 2px 2px 3px rgba(0,0,0,.28); min-width: 190px; display: none;
}
.popup.show { display: block; }
.popup .item { display: flex; align-items: center; height: 22px; padding: 0 22px 0 28px; white-space: nowrap; position: relative; cursor: default; }
.popup .item:hover:not(.disabled) { background: var(--menuhover); }
.popup .item.disabled { color: #8d8d8d; }
.popup .item.default { font-weight: 600; }
.popup .item .key { margin-left: auto; padding-left: 28px; color: inherit; }
.popup .item .check { position: absolute; left: 9px; }
.popup .sep { height: 1px; background: #d7d7d7; margin: 3px 2px 3px 28px; }

/* ---- main area ---- */
#main { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--line); }
#sidebar { width: 210px; flex: none; display: flex; flex-direction: column; background: var(--white); border-right: 1px solid var(--line); min-width: 0; }
#sidebar.hidden { display: none; }
#tree { flex: 1; overflow: auto; padding: 4px 0; }
.group { display: flex; align-items: center; gap: 5px; padding: 6px 8px 2px; color: #3c3c3c; font-weight: 600; cursor: default; }
.group svg { width: 9px; height: 9px; fill: #6d6d6d; }
.node { display: flex; align-items: center; gap: 7px; height: 22px; padding: 0 8px 0 22px; border: 1px solid transparent; cursor: default; white-space: nowrap; }
.node:hover { background: var(--hover); border-color: var(--hoverline); }
.node.active { background: var(--sel); border-color: var(--selline); }
.node .ico { width: 16px; height: 16px; flex: none; }
.node .count { margin-left: auto; color: var(--text3); font-size: 11px; }
#art { flex: none; border-top: 1px solid var(--line); padding: 8px; background: var(--white); cursor: pointer; }
#artbox { width: 100%; aspect-ratio: 1; background: #fff; display: grid; place-items: center; overflow: hidden; border: 1px solid #ececec; }
#artbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
#artbox svg { width: 62%; height: 62%; }
#arttitle { margin-top: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#artsub { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }

#playlist { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--white); }
#plhead { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; background: var(--win); border-bottom: 1px solid var(--line); flex: none; }
#crumb { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid var(--line2); background: linear-gradient(#fdfdfd, #ececec); border-radius: 2px; white-space: nowrap; }
#crumb svg { width: 14px; height: 14px; }
#plcount { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#search { margin-left: auto; position: relative; flex: 0 1 230px; min-width: 120px; }
#search input { width: 100%; height: 22px; border: 1px solid #7a7a7a; padding: 0 22px 0 6px; font: inherit; background: #fff; outline: none; }
#search input:focus { border-color: var(--accent); }
#search input::placeholder { color: #8a8a8a; font-style: italic; }
#search svg { position: absolute; right: 5px; top: 5px; width: 12px; height: 12px; fill: #6d6d6d; pointer-events: none; }
#search .clear { position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border: 0; background: #fff; display: none; cursor: pointer; color: #666; padding: 0; }

#table { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; outline: none; }
#thead { flex: none; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--white); }
#theadin { display: grid; height: 23px; }
.th { position: relative; display: flex; align-items: center; padding: 0 6px; border-right: 1px solid #e5e5e5; white-space: nowrap; overflow: hidden; cursor: default; }
.th:hover { background: var(--hover); }
.th .arrow { position: absolute; top: -1px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #6d6d6d; line-height: 1; }
.th .grip { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 2; }
.th.right { justify-content: flex-end; }
#tbody { flex: 1; overflow: auto; position: relative; }
#spacer { position: relative; }
.row { position: absolute; left: 0; display: grid; height: 20px; align-items: center; border: 1px solid transparent; white-space: nowrap; cursor: default; }
.row:hover { background: var(--hover); border-color: var(--hoverline); }
.row.sel { background: var(--sel); border-color: var(--sel); }
#table:not(:focus-within) .row.sel { background: var(--selblur); border-color: var(--selblur); }
.row.focus { border-color: var(--selline); }
.row.now { font-weight: 700; }
.row > div { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; }
.row .right { text-align: right; }
.row .ico { padding: 0; display: grid; place-items: center; }
.row .ico svg { width: 12px; height: 12px; }
.st-done { color: var(--green); }
.st-now { color: var(--blue); }
.st-queued { color: var(--blue); }
.st-failed { color: var(--red); }
.st-skip, .st-todo { color: var(--text2); }
#empty { position: absolute; inset: 60px 20px auto; text-align: center; color: var(--text3); display: none; pointer-events: none; }
#empty svg { width: 64px; height: 64px; opacity: .35; display: block; margin: 0 auto 10px; }

/* ---- controls ---- */
#controls { flex: none; background: var(--win); border-top: 1px solid var(--line); padding: 4px 8px 5px; }
#seekrow { display: flex; align-items: center; gap: 8px; height: 22px; }
.time { min-width: 44px; font-variant-numeric: tabular-nums; }
.time.right { text-align: right; }
#seek { flex: 1; position: relative; height: 18px; display: flex; align-items: center; }
#groove { position: relative; width: 100%; height: 8px; background: var(--groove); border: 1px solid #b4b4b4; border-radius: 4px; overflow: hidden; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#a6d8ff, #4aa3e8 55%, #2f86d0); transition: width .9s linear; }
#fill.busy { background: repeating-linear-gradient(-45deg, #a6d8ff 0 6px, #7cc0f3 6px 12px); background-size: 17px 100%; animation: busy 0.8s linear infinite; width: 100% !important; transition: none; }
@keyframes busy { to { background-position: 17px 0; } }
#knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff, #e3e3e3); border: 1px solid #8e8e8e; left: 0; transition: left .9s linear; display: none; }
#seek:hover #knob { display: block; }
#btnrow { display: flex; align-items: center; gap: 4px; margin-top: 3px; height: 40px; }
.btn { width: 30px; height: 26px; display: grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 2px; padding: 0; cursor: default; }
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--hoverline); }
.btn:active:not(:disabled) { background: var(--sel); border-color: var(--selline); }
.btn:disabled svg { opacity: .35; }
.btn svg { width: 16px; height: 16px; fill: #3c3c3c; }
.btn.on svg { fill: var(--accent); }
#play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #8f8f8f; background: radial-gradient(circle at 50% 30%, #ffffff, #e9e9e9 60%, #d6d6d6); box-shadow: inset 0 1px 0 #fff, 0 1px 1px rgba(0,0,0,.12); margin-right: 6px; }
#play:hover { border-color: #5a9fd6; background: radial-gradient(circle at 50% 30%, #fff, #e8f4ff 60%, #cfe6fa); }
#play svg { width: 18px; height: 18px; fill: #2b2b2b; }
.grp { display: flex; border: 1px solid #b5b5b5; border-radius: 3px; background: linear-gradient(#fbfbfb, #ebebeb); overflow: hidden; }
.grp .btn { border-radius: 0; border: 0; border-right: 1px solid #cfcfcf; height: 24px; }
.grp .btn:last-child { border-right: 0; }
.gap { width: 10px; flex: none; }
#gpu { margin-left: auto; display: flex; align-items: center; gap: 6px; }
#gpu svg.chip { width: 16px; height: 16px; fill: #3c3c3c; }
#wedge { width: 82px; height: 20px; position: relative; }
#wedge svg { width: 100%; height: 100%; display: block; }
#gpupct { min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---- status bar ---- */
#statusbar { flex: none; display: flex; align-items: center; height: 22px; padding: 0 8px; gap: 14px; background: var(--win); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
#statusbar.hidden { display: none; }
#stmsg { flex: 1; overflow: hidden; text-overflow: ellipsis; }
#stmsg.flash { color: var(--blue); }
.stcell { color: #333; }
.stcell + .stcell { border-left: 1px solid #cfcfcf; padding-left: 14px; }
#stspeed { min-width: 44px; text-align: center; }
#offline { display: none; color: var(--red); font-weight: 600; }

/* ---- dialogs ---- */
#veil { position: fixed; inset: 0; z-index: 50; display: none; }
#veil.modal { background: rgba(0,0,0,0.04); }
.dlg { position: fixed; z-index: 60; background: var(--win); border: 1px solid #1883d7; box-shadow: 0 8px 28px rgba(0,0,0,.28); display: none; flex-direction: column; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
.dlg.show { display: flex; }
.dlg .tbar { display: flex; align-items: center; height: 30px; background: #fff; padding-left: 8px; gap: 8px; cursor: default; flex: none; }
.dlg .tbar svg.cone { width: 16px; height: 16px; }
.dlg .tbar .x { margin-left: auto; width: 46px; height: 30px; border: 0; background: none; display: grid; place-items: center; }
.dlg .tbar .x:hover { background: #e81123; color: #fff; }
.dlg .tbar .x svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.1; }
.dlg .body { padding: 10px; overflow: auto; flex: 1; min-height: 0; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 10px 10px; flex: none; }
.pbtn { min-width: 75px; height: 23px; padding: 0 10px; border: 1px solid #adadad; background: #e1e1e1; cursor: default; }
.pbtn:hover { background: #e5f1fb; border-color: #0078d7; }
.pbtn.primary { border: 2px solid #0078d7; }
.tabs { display: flex; gap: 0; margin-bottom: -1px; position: relative; z-index: 1; }
.tab { padding: 3px 10px; border: 1px solid #d9d9d9; border-bottom-color: #d9d9d9; background: #f0f0f0; margin-right: -1px; cursor: default; }
.tab.active { background: #fff; border-bottom-color: #fff; }
.tabpage { background: #fff; border: 1px solid #d9d9d9; padding: 10px; display: none; }
.tabpage.active { display: block; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; }
.form label { text-align: right; color: #222; }
.field { height: 22px; border: 1px solid #a5a5a5; background: #fff; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; -webkit-user-select: text; }
.field.dim { background: #f7f7f7; color: #444; }
fieldset { border: 1px solid #d5dfe5; border-radius: 3px; margin: 0 0 10px; padding: 8px 10px 10px; }
legend { padding: 0 3px; color: #1d4f8c; }
#log { height: 100%; min-height: 240px; background: #fff; border: 1px solid #a5a5a5; padding: 4px 6px; overflow: auto; font: 12px/1.45 Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
#log .warn { color: #b25b00; }
#log .err { color: var(--red); }
#log .page { color: var(--blue); }
#log .done { color: var(--green); }
.streams { margin: 0; padding-left: 0; list-style: none; }
.streams li { padding: 3px 0 3px 18px; position: relative; }
.streams li::before { content: ""; position: absolute; left: 4px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #888); }
.msgbox { display: flex; gap: 14px; align-items: flex-start; padding: 6px 4px 4px; max-width: 420px; }
.msgbox svg { width: 32px; height: 32px; flex: none; }
.about { display: flex; gap: 18px; align-items: center; padding: 8px 6px; }
.about svg { width: 96px; height: 96px; flex: none; }
.about h1 { font-size: 22px; font-weight: 400; margin: 0 0 4px; }
.about p { margin: 3px 0; color: #333; }

@media (max-width: 760px) {
  #sidebar { position: absolute; z-index: 30; top: 22px; bottom: 98px; left: 0; box-shadow: 4px 0 10px rgba(0,0,0,.15); }
  #sidebar:not(.shown) { display: none; }
  .menu-title.opt { display: none; }
  .wide { display: none !important; }
  #wedge { width: 54px; }
  #search { flex-basis: 150px; }
  .stcell.wide { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="menubar">
    <div class="menu-title" data-menu="media"><u>M</u>edia</div>
    <div class="menu-title" data-menu="playback"><u>P</u>layback</div>
    <div class="menu-title opt" data-menu="audio"><u>A</u>udio</div>
    <div class="menu-title opt" data-menu="video"><u>V</u>ideo</div>
    <div class="menu-title opt" data-menu="subtitle">Subt<u>i</u>tle</div>
    <div class="menu-title" data-menu="tools"><u>T</u>ools</div>
    <div class="menu-title" data-menu="view">V<u>i</u>ew</div>
    <div class="menu-title" data-menu="help"><u>H</u>elp</div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div id="tree"></div>
      <div id="art" title="Go to the song being separated">
        <div id="artbox"></div>
        <div id="arttitle">stemd</div>
        <div id="artsub"></div>
      </div>
    </div>
    <div id="playlist">
      <div id="plhead">
        <div id="crumb"></div>
        <div id="plcount"></div>
        <div id="search">
          <input id="q" type="text" placeholder="Search in Queue" spellcheck="false" autocomplete="off">
          <svg viewBox="0 0 16 16"><path d="M6.5 1a5.5 5.5 0 0 1 4.38 8.82l3.65 3.65-1.06 1.06-3.65-3.65A5.5 5.5 0 1 1 6.5 1zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
          <button class="clear" title="Clear">✕</button>
        </div>
      </div>
      <div id="table" tabindex="0">
        <div id="thead"><div id="theadin"></div></div>
        <div id="tbody"><div id="spacer"></div></div>
        <div id="empty"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="seekrow">
      <div class="time" id="tpos">--:--</div>
      <div id="seek" title=""><div id="groove"><div id="fill"></div></div><div id="knob"></div></div>
      <div class="time right" id="tdur">--:--</div>
    </div>
    <div id="btnrow">
      <button class="btn" id="play" title="Pause after this song (Space)"></button>
      <div class="grp">
        <button class="btn" id="prev" title="Previous" disabled></button>
        <button class="btn" id="stop" title="Stop now: cancel this song and pause (S)"></button>
        <button class="btn" id="next" title="Skip this song (N)"></button>
      </div>
      <div class="gap"></div>
      <button class="btn wide" id="fs" title="Toggle fullscreen (F11)"></button>
      <button class="btn" id="ext" title="Show settings (Ctrl+P)"></button>
      <button class="btn" id="pl" title="Toggle the sidebar (Ctrl+L)"></button>
      <div class="gap wide"></div>
      <button class="btn" id="loop" title="Rescan the library now (F5)"></button>
      <button class="btn wide" id="rand" title="Random" disabled></button>
      <div id="gpu" title="GPU">
        <svg class="chip" viewBox="0 0 16 16"><path d="M5 1h1v2h1.5V1h1v2H10V1h1v2h1a1 1 0 0 1 1 1v1h2v1h-2v1.5h2v1h-2V10h2v1h-2v1a1 1 0 0 1-1 1h-1v2h-1v-2H8.5v2h-1v-2H6v2H5v-2H4a1 1 0 0 1-1-1v-1H1v-1h2V8.5H1v-1h2V6H1V5h2V4a1 1 0 0 1 1-1h1zm-.5 3.5v7h7v-7zm2 2h3v3h-3z"/></svg>
        <div id="wedge"></div>
        <div id="gpupct">--</div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="offline">Can't reach stemd</span>
    <span id="stmsg">Connecting…</span>
    <span class="stcell wide" id="stcounts"></span>
    <span class="stcell wide" id="stgpu"></span>
    <span class="stcell" id="stspeed" title="Separation speed (times realtime)">--</span>
    <span class="stcell" id="sttime">--:--/--:--</span>
  </div>
</div>

<div id="veil"></div>
<div class="popup" id="popup"></div>

<div class="dlg" id="dlg-messages" style="width: 720px; height: 460px">
  <div class="tbar"><span class="cone-slot"></span><span>Messages</span><button class="x" data-close><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>
  <div class="body" style="display:flex; flex-direction:column; gap:8px">
    <div class="tabs"><div class="tab active">Messages</div></div>
    <div id="log" style="flex:1"></div>
  </div>
  <div class="foot">
    <label style="margin-right:auto; display:flex; align-items:center; gap:6px"><input type="checkbox" id="follow" checked> Follow new messages</label>
    <button class="pbtn" id="logclear">Clear</button>
    <button class="pbtn primary" data-close>Close</button>
  </div>
</div>

<div class="dlg" id="dlg-info" style="width: 560px">
  <div class="tbar"><span class="cone-slot"></span><span>Current Media Information</span><button class="x" data-close><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>
  <div class="body">
    <div class="tabs"><div class="tab active" data-tab="general">General</div><div class="tab" data-tab="stems">Stems</div><div class="tab" data-tab="stats">Statistics</div></div>
    <div class="tabpage active" data-page="general"><div class="form" id="info-general"></div></div>
    <div class="tabpage" data-page="stems"><div id="info-stems"></div></div>
    <div class="tabpage" data-page="stats"><div class="form" id="info-stats"></div></div>
    <div class="form" style="margin-top:10px"><label>Location:</label><div class="field dim" id="info-loc"></div></div>
  </div>
  <div class="foot"><button class="pbtn primary" data-close>Close</button></div>
</div>

<div class="dlg" id="dlg-prefs" style="width: 520px">
  <div class="tbar"><span class="cone-slot"></span><span>Simple Preferences</span><button class="x" data-close><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>
  <div class="body" id="prefs"></div>
  <div class="foot"><button class="pbtn primary" data-close>Close</button></div>
</div>

<div class="dlg" id="dlg-about" style="width: 520px">
  <div class="tbar"><span class="cone-slot"></span><span>About</span><button class="x" data-close><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>
  <div class="body" id="about"></div>
  <div class="foot"><button class="pbtn primary" data-close>Close</button></div>
</div>

<div class="dlg" id="dlg-confirm" style="width: 440px">
  <div class="tbar"><span class="cone-slot"></span><span id="cf-title">stemd</span><button class="x" data-close><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>
  <div class="body"><div class="msgbox"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#2b6fd6"/><path d="M12.2 12.3c0-2.4 1.8-3.9 4-3.9 2.3 0 3.9 1.5 3.9 3.5 0 1.6-.9 2.5-2.1 3.3-1 .7-1.4 1.1-1.4 2.2v.7h-2.2v-.9c0-1.7.7-2.4 1.8-3.2 1-.7 1.6-1.2 1.6-2.1 0-1-.7-1.6-1.7-1.6-1.1 0-1.8.8-1.8 2zm2.1 8.6h2.4v2.4h-2.4z" fill="#fff"/></svg><div id="cf-text"></div></div></div>
  <div class="foot"><button class="pbtn primary" id="cf-yes">Yes</button><button class="pbtn" data-close>No</button></div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------- icons
const CONE = `<svg class="cone" viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#ff9a1f"/><stop offset=".55" stop-color="#ff8800"/><stop offset="1" stop-color="#e06d00"/></linearGradient></defs><path d="M27 5h10l14 47H13z" fill="url(#cg)"/><path d="M23.6 17h16.8l2.7 9H20.9zM19.3 31.5h25.4l2.7 9H16.6z" fill="#fff"/><path d="M5 51h54a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z" fill="#e06d00"/><path d="M27 5h4l-2 47h-16z" fill="#fff" opacity=".12"/></svg>`;
const I = {
  play: '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>',
  prev: '<svg viewBox="0 0 16 16"><path d="M2 3h2v10H2zM14 3v10L8 8zM8 3v10L2 8z" transform="translate(1 0)"/></svg>',
  stop: '<svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M12 3h2v10h-2zM2 3l6 5-6 5zM7 3l6 5-6 5z" transform="translate(-1 0)"/></svg>',
  fs: '<svg viewBox="0 0 16 16"><path d="M1 1h5v1.5H2.5V6H1zM10 1h5v5h-1.5V2.5H10zM1 10h1.5v3.5H6V15H1zM13.5 10H15v5h-5v-1.5h3.5z"/></svg>',
  ext: '<svg viewBox="0 0 16 16"><path d="M1 3h8v1.5H1zM12 3h3v1.5h-3zM9.5 1.5h2v4.5h-2zM1 11.5h3V13H1zM7 11.5h8V13H7zM4.5 10h2v4.5h-2zM1 7.25h11v1.5H1zM14 7.25h1v1.5h-1zM12 5.75h1.8v4.5H12z"/></svg>',
  pl: '<svg viewBox="0 0 16 16"><path d="M1 2h2v2H1zM5 2h10v2H5zM1 7h2v2H1zM5 7h10v2H5zM1 12h2v2H1zM5 12h10v2H5z"/></svg>',
  loop: '<svg viewBox="0 0 16 16"><path d="M3 6.5A4.5 4.5 0 0 1 11.6 4H9.5V5.5h4.5V1h-1.5v1.9A6 6 0 0 0 1.5 6.5zM13 9.5A4.5 4.5 0 0 1 4.4 12h2.1v-1.5H2V15h1.5v-1.9a6 6 0 0 0 11-3.6z"/></svg>',
  rand: '<svg viewBox="0 0 16 16"><path d="M1 4h3c2.5 0 3.6 1.6 4.7 3.3C9.6 8.8 10.4 10.5 12 10.5h.5V9l3 2.25-3 2.25V12H12c-2.5 0-3.6-1.7-4.6-3.4C6.5 7.1 5.6 5.5 4 5.5H1zm11.5-.5V2l3 2.25-3 2.25V5H12c-1.1 0-1.8.7-2.5 1.6l-.9-1.4C9.5 4.2 10.5 3.5 12 3.5zM1 10.5h3c1.1 0 1.8-.7 2.4-1.6l.9 1.4C6.5 11.3 5.5 12 4 12H1z"/></svg>',
  queue: '<svg class="ico" viewBox="0 0 16 16"><path d="M1 3h9v1.5H1zM1 7h9v1.5H1zM1 11h6v1.5H1z" fill="#555"/><path d="M10 9.5l5 3-5 3z" fill="#ff8800"/></svg>',
  lib: '<svg class="ico" viewBox="0 0 16 16"><path d="M1.5 2h3v12h-3zM5.5 2h3v12h-3z" fill="#7a5d3a"/><path d="M9.6 2.6l2.9-.8 3 11.6-2.9.8z" fill="#b0874f"/></svg>',
  done: '<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#3a9a3a"/><path d="M4.5 8.2l2.3 2.3 4.7-4.8" stroke="#fff" stroke-width="1.8" fill="none"/></svg>',
  todo: '<svg class="ico" viewBox="0 0 16 16"><path d="M6 1.5v9.2A2.6 2.6 0 1 0 7.5 13V5h5V1.5z" fill="#3b7dd8"/></svg>',
  recent: '<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="#fff" stroke="#6b6b6b" stroke-width="1.3"/><path d="M7.3 4h1.4v3.7l2.6 1.5-.7 1.2-3.3-1.9z" fill="#333"/></svg>',
  failed: '<svg class="ico" viewBox="0 0 16 16"><path d="M8 1l7 13H1z" fill="#f2b600"/><path d="M7.2 5.5h1.6l-.3 4.5h-1zM7.2 11h1.6v1.6H7.2z" fill="#222"/></svg>',
  arrow: '<svg viewBox="0 0 10 10"><path d="M2 1l5 4-5 4z"/></svg>',
  arrowdown: '<svg viewBox="0 0 10 10"><path d="M1 2l4 5 4-5z"/></svg>',
};
const RI = {
  now: '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#0063b1"/></svg>',
  done: '<svg viewBox="0 0 12 12"><path d="M1.5 6.3l3 3 6-6.4" stroke="#2e8b2e" stroke-width="1.8" fill="none"/></svg>',
  failed: '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#c42b1c" stroke-width="1.8"/></svg>',
  skip: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" stroke="#8a8a8a" stroke-width="1.4" fill="none"/><path d="M2.8 9.2l6.4-6.4" stroke="#8a8a8a" stroke-width="1.4"/></svg>',
  queued: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.8" stroke="#0063b1" stroke-width="1.3" fill="none"/><path d="M5.4 3h1.2v3.1l2 1.2-.6 1-2.6-1.6z" fill="#0063b1"/></svg>',
  stemnow: '<svg viewBox="0 0 12 12"><path d="M6.8 1L2.5 7h3l-.7 4 4.7-6.2H6.3z" fill="#ff8800"/></svg>',
};
document.querySelectorAll(".cone-slot").forEach(e => e.outerHTML = CONE);
for (const id of ["play", "prev", "stop", "next", "fs", "ext", "pl", "loop", "rand"]) $(id).innerHTML = I[id];

// ---------------------------------------------------------------- helpers
function $(id) { return document.getElementById(id); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const nf = new Intl.NumberFormat();
const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
function clock(s) {
  if (s == null || !isFinite(s)) return "--:--";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(x).padStart(2, "0");
}
function stamp(t) {
  if (!t) return "";
  const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function songs(n) { return nf.format(n) + (n === 1 ? " song" : " songs"); }
const store = {
  get(k, d) { try { const v = localStorage.getItem("stemd." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("stemd." + k, JSON.stringify(v)); } catch {} },
};
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

// Folder layout: Artist/Album/01 Song.flac, or Album/01 Song.flac, with CD1/Disc 2 subfolders.
function parse(rel) {
  const parts = rel.split("/");
  const file = parts.pop();
  const dot = file.lastIndexOf(".");
  const title = dot > 0 ? file.slice(0, dot) : file;
  let album = parts.pop() || "", disc = "";
  if ((/^(cd|disc|disk)\s*\d+$/i.test(album) || /\bvinyl\s*\d+$/i.test(album)) && parts.length) { disc = album; album = parts.pop(); }
  const artist = parts.pop() || "";
  return { title, album: disc ? `${album} (${disc})` : album, artist };
}

// ---------------------------------------------------------------- state
let S = null;            // last /api/state
let skew = 0;            // server clock - ours
let rows = [];           // library rows, with parsed title/artist/album
let byRel = new Map();
let libRev = -1;
let view = store.get("view", "queue");
let sort = store.get("sort", {});
let list = [];           // rows in the current view, filtered and sorted
const sel = new Set();
let anchor = -1, focusI = -1;
const ROW = 20;

const VIEWS = {
  queue: { name: "Queue", icon: "queue", filter: r => r.q != null, sort: ["q", 1], empty: "Nothing queued. Everything in your library has stems." },
  all: { name: "Media Library", icon: "lib", filter: () => true, sort: ["artist", 1], empty: "No music found yet. The first scan may still be running." },
  done: { name: "Stemmed", icon: "done", filter: r => r.s === "done", sort: ["artist", 1], empty: "Nothing stemmed yet." },
  todo: { name: "Not Stemmed", icon: "todo", filter: r => r.s === "todo" || r.s === "now", sort: ["artist", 1], empty: "Every song has stems." },
  recent: { name: "Recently Stemmed", icon: "recent", filter: r => r.s === "done", sort: ["f", -1], limit: 500, empty: "Nothing stemmed yet." },
  failed: { name: "Failed & Skipped", icon: "failed", filter: r => r.s === "failed" || r.s === "skip", sort: ["artist", 1], empty: "No failures. Nice." },
};
const GROUPS = [["Playlist", ["queue", "all"]], ["My Music", ["done", "todo", "recent", "failed"]]];

const COLS = [
  { id: "ico", label: "", w: 22, fixed: true },
  { id: "title", label: "Title", w: 330 },
  { id: "artist", label: "Artist", w: 170, wide: true },
  { id: "album", label: "Album", w: 230, wide: true },
  { id: "status", label: "Status", w: 160 },
  { id: "d", label: "Duration", w: 72, right: true },
  { id: "f", label: "Stemmed", w: 128, wide: true },
];
const widths = store.get("widths", {});
for (const c of COLS) if (widths[c.id]) c.w = widths[c.id];

function statusOf(r) {
  if (r.s === "now") {
    const p = S?.current?.rel === r.r ? S.current.pct : 0;
    return { cls: "st-now", ico: "now", text: `Separating ${Math.floor(p * 100)}%` };
  }
  if (r.s === "done") {
    const other = r.m && S?.info?.model && r.m !== S.info.model;
    return { cls: "st-done", ico: "done", text: other ? `Stemmed (${modelName(r.m)})` : "Stemmed" };
  }
  if (r.s === "failed") return { cls: "st-failed", ico: "failed", text: "Failed: " + (r.e || "error") };
  if (r.s === "skip") return { cls: "st-skip", ico: "skip", text: "Don't Stem" };
  if (r.q != null) return r.n ? { cls: "st-queued", ico: "stemnow", text: `Stem Now · #${r.q + 1}` } : { cls: "st-queued", ico: "queued", text: `Queued · #${r.q + 1}` };
  return { cls: "st-todo", ico: "", text: "Not stemmed" };
}
function modelName(id) { return S?.info?.models?.[id] || id || ""; }
const STATUS_RANK = { now: 0, todo: 1, failed: 2, skip: 3, done: 4 };
function sortKey(r, k) {
  switch (k) {
    case "status": return (r.q != null ? r.q : 1e7) + STATUS_RANK[r.s] * 1e8;
    case "d": return r.d ?? -1;
    case "f": return r.f ?? 0;
    case "q": return r.q ?? 1e9;
    default: return r[k] || "";
  }
}

// ---------------------------------------------------------------- sidebar
function counts() {
  const c = { queue: 0, all: rows.length, done: 0, todo: 0, recent: 0, failed: 0 };
  for (const r of rows) {
    if (r.q != null) c.queue++;
    if (r.s === "done") c.done++;
    else if (r.s === "todo" || r.s === "now") c.todo++;
    else c.failed++;
  }
  c.recent = Math.min(c.done, 500);
  return c;
}
function drawTree() {
  const c = counts();
  $("tree").innerHTML = GROUPS.map(([g, ids]) =>
    `<div class="group">${I.arrowdown}${esc(g)}</div>` + ids.map(id =>
      `<div class="node${id === view ? " active" : ""}" data-view="${id}">${I[VIEWS[id].icon]}<span>${esc(VIEWS[id].name)}</span><span class="count">${c[id] ? nf.format(c[id]) : ""}</span></div>`).join("")).join("");
}
$("tree").addEventListener("click", e => {
  const n = e.target.closest(".node");
  if (n) setView(n.dataset.view);
});
function setView(v) {
  if (!VIEWS[v]) return;
  view = v; store.set("view", v);
  sel.clear(); anchor = focusI = -1;
  $("q").placeholder = "Search in " + VIEWS[v].name;
  $("tbody").scrollTop = 0;
  if (innerWidth <= 760) $("sidebar").classList.remove("shown");
  drawTree(); rebuild();
}

// ---------------------------------------------------------------- table
// On a phone: no Artist/Album/Stemmed columns, and the title takes whatever the rest leave.
const narrow = () => innerWidth <= 760;
const NARROW_W = { ico: 22, status: 118, d: 64 };
function colW(c) {
  if (!narrow()) return c.w;
  if (c.id === "title") return Math.max(140, $("tbody").clientWidth - NARROW_W.ico - NARROW_W.status - NARROW_W.d);
  return NARROW_W[c.id] ?? c.w;
}
function visibleCols() { return COLS.filter(c => !(c.wide && narrow())); }
function gridCols() { return visibleCols().map(c => colW(c) + "px").join(" "); }
function totalW() { return visibleCols().reduce((a, c) => a + colW(c), 0); }
function drawHead() {
  const [sk, sd] = sort[view] || VIEWS[view].sort;
  const h = $("theadin");
  h.style.gridTemplateColumns = gridCols();
  h.style.width = Math.max(totalW(), $("tbody").clientWidth) + "px";
  h.innerHTML = visibleCols().map(c => {
    const key = c.id === "status" ? "status" : c.id;
    const arrow = key === sk ? `<span class="arrow">${sd > 0 ? "▲" : "▼"}</span>` : "";
    return `<div class="th${c.right ? " right" : ""}" data-col="${c.id}">${arrow}${esc(c.label)}${c.fixed || narrow() ? "" : '<span class="grip"></span>'}</div>`;
  }).join("");
}
$("theadin").addEventListener("click", e => {
  if (e.target.classList.contains("grip")) return;
  const th = e.target.closest(".th");
  if (!th || th.dataset.col === "ico") return;
  const k = th.dataset.col;
  const [sk, sd] = sort[view] || VIEWS[view].sort;
  sort[view] = [k, k === sk ? -sd : (k === "f" || k === "d" ? -1 : 1)];
  store.set("sort", sort);
  rebuild();
});
$("theadin").addEventListener("pointerdown", e => {
  if (!e.target.classList.contains("grip")) return;
  e.preventDefault();
  const col = COLS.find(c => c.id === e.target.parentElement.dataset.col);
  const x0 = e.clientX, w0 = col.w;
  const move = ev => { col.w = Math.max(40, w0 + ev.clientX - x0); drawHead(); render(); };
  const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); widths[col.id] = col.w; store.set("widths", widths); };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
});

function rebuild() {
  const v = VIEWS[view];
  const q = $("q").value.trim().toLowerCase();
  $("search").querySelector(".clear").style.display = q ? "block" : "none";
  let l = rows.filter(v.filter);
  const [sk, sd] = sort[view] || v.sort;
  if (v.limit) {
    l.sort((a, b) => (b.f || 0) - (a.f || 0));
    l = l.slice(0, v.limit);
  }
  if (q) {
    const words = q.split(/\s+/);
    l = l.filter(r => words.every(w => r.lc.includes(w)));
  }
  l.sort((a, b) => {
    const x = sortKey(a, sk), y = sortKey(b, sk);
    let c = typeof x === "number" ? x - y : coll.compare(x, y);
    if (!c && sk !== "title") c = coll.compare(a.artist, b.artist) || coll.compare(a.album, b.album) || coll.compare(a.title, b.title);
    return c * sd;
  });
  list = l;
  if (focusI >= list.length) focusI = list.length - 1;
  $("crumb").innerHTML = I[v.icon] + esc(v.name);
  const total = list.reduce((a, r) => a + (r.d || 0), 0);
  $("plcount").textContent = songs(list.length) + (total ? " · " + clock(total) : "") + (q ? " matching" : "");
  const e = $("empty");
  e.style.display = list.length ? "none" : "block";
  e.innerHTML = list.length ? "" : CONE + esc(q ? "No songs match your search." : (libRev < 0 ? "Loading the library…" : v.empty));
  $("spacer").style.height = list.length * ROW + "px";
  drawHead();
  render();
}

function render() {
  const body = $("tbody");
  const w = Math.max(totalW(), body.clientWidth);
  $("spacer").style.width = w + "px";
  const first = Math.max(0, Math.floor(body.scrollTop / ROW) - 4);
  const last = Math.min(list.length, first + Math.ceil(body.clientHeight / ROW) + 8);
  const cols = gridCols(), vis = visibleCols();
  let html = "";
  for (let i = first; i < last; i++) {
    const r = list[i], st = statusOf(r);
    const cls = "row" + (sel.has(r.r) ? " sel" : "") + (i === focusI ? " focus" : "") + (r.s === "now" ? " now" : "");
    html += `<div class="${cls}" data-i="${i}" style="top:${i * ROW}px;width:${w}px;grid-template-columns:${cols}">`;
    for (const c of vis) {
      switch (c.id) {
        case "ico": html += `<div class="ico">${RI[st.ico] || ""}</div>`; break;
        case "title": html += `<div title="${esc(r.r)}">${esc(r.title)}</div>`; break;
        case "artist": html += `<div>${esc(r.artist)}</div>`; break;
        case "album": html += `<div>${esc(r.album)}</div>`; break;
        case "status": html += `<div class="${st.cls}" title="${esc(st.text)}">${esc(st.text)}</div>`; break;
        case "d": html += `<div class="right">${r.d ? clock(r.d) : ""}</div>`; break;
        case "f": html += `<div>${r.s === "done" ? stamp(r.f) : ""}</div>`; break;
      }
    }
    html += "</div>";
  }
  $("spacer").innerHTML = html;
}
$("tbody").addEventListener("scroll", () => {
  $("theadin").style.transform = `translateX(${-$("tbody").scrollLeft}px)`;
  render();
}, { passive: true });
addEventListener("resize", () => { drawHead(); render(); });

function rowAt(e) { const el = e.target.closest(".row"); return el ? +el.dataset.i : -1; }
function selectTo(i, e) {
  if (i < 0) return;
  if (e?.shiftKey && anchor >= 0) {
    if (!e.ctrlKey && !e.metaKey) sel.clear();
    const [a, b] = anchor < i ? [anchor, i] : [i, anchor];
    for (let k = a; k <= b; k++) sel.add(list[k].r);
  } else if (e?.ctrlKey || e?.metaKey) {
    sel.has(list[i].r) ? sel.delete(list[i].r) : sel.add(list[i].r);
    anchor = i;
  } else {
    sel.clear(); sel.add(list[i].r); anchor = i;
  }
  focusI = i;
  paintSel();
}
// Selection changes restyle the rows in place: rebuilding them under the pointer loses double-clicks.
function paintSel() {
  for (const el of $("spacer").children) {
    const i = +el.dataset.i, r = list[i];
    el.classList.toggle("sel", sel.has(r.r));
    el.classList.toggle("focus", i === focusI);
  }
}
function paintNow() {
  for (const el of $("spacer").querySelectorAll(".row.now .st-now")) {
    const r = list[+el.parentElement.dataset.i];
    el.textContent = el.title = statusOf(r).text;
  }
}
function reveal(i) {
  const b = $("tbody");
  if (i * ROW < b.scrollTop) b.scrollTop = i * ROW;
  else if ((i + 1) * ROW > b.scrollTop + b.clientHeight) b.scrollTop = (i + 1) * ROW - b.clientHeight;
}
$("tbody").addEventListener("mousedown", e => {
  if (e.button === 2) {
    const i = rowAt(e);
    if (i >= 0 && !sel.has(list[i].r)) selectTo(i);
    return;
  }
  if (e.button !== 0) return;
  const i = rowAt(e);
  if (i < 0) { sel.clear(); paintSel(); return; }
  if (e.detail === 2 && !e.shiftKey && !e.ctrlKey && !e.metaKey) { defaultAction([list[i]]); return; }
  selectTo(i, e);
});
$("tbody").addEventListener("contextmenu", e => {
  e.preventDefault();
  const picked = selected();
  if (picked.length) showMenu(rowMenu(picked), e.clientX, e.clientY);
});
$("table").addEventListener("keydown", e => {
  if (e.target === $("q")) return;
  const page = Math.max(1, Math.floor($("tbody").clientHeight / ROW) - 1);
  let i = focusI;
  switch (e.key) {
    case "ArrowDown": i = Math.min(list.length - 1, i + 1); break;
    case "ArrowUp": i = Math.max(0, i - 1); break;
    case "PageDown": i = Math.min(list.length - 1, i + page); break;
    case "PageUp": i = Math.max(0, i - page); break;
    case "Home": i = 0; break;
    case "End": i = list.length - 1; break;
    case "Enter": if (selected().length) defaultAction(selected()); e.preventDefault(); return;
    case "Delete": { const s = selected().filter(r => r.n); if (s.length) act("unqueue", s); e.preventDefault(); return; }
    case "a": if (e.ctrlKey || e.metaKey) { list.forEach(r => sel.add(r.r)); paintSel(); e.preventDefault(); } return;
    case "ContextMenu": { const s = selected(); if (s.length) { const el = $("spacer").querySelector(".row.focus") || $("spacer").querySelector(".row.sel"); const b = (el || $("tbody")).getBoundingClientRect(); showMenu(rowMenu(s), b.left + 40, b.bottom); } e.preventDefault(); return; }
    default: return;
  }
  e.preventDefault();
  if (i < 0) i = 0;
  if (!list.length) return;
  if (e.shiftKey) { if (anchor < 0) anchor = focusI < 0 ? i : focusI; selectTo(i, { shiftKey: true }); }
  else selectTo(i);
  reveal(i);
});
function selected() { return list.filter(r => sel.has(r.r)); }

// ---------------------------------------------------------------- actions
let flashTimer = 0;
function flash(text) {
  const m = $("stmsg");
  m.textContent = text; m.classList.add("flash");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { m.classList.remove("flash"); drawStatus(); }, 4000);
}
async function act(action, picked) {
  const rels = picked.map(r => r.r);
  try {
    const res = await api("/api/tracks", { action, rels });
    const n = res.n ?? rels.length;
    flash({
      next: `${songs(n)} will be stemmed next`, enqueue: `${songs(n)} added to the queue`,
      unqueue: `${songs(n)} taken off the Stem Now queue`, exclude: `${songs(n)} won't be stemmed`,
      retry: `${songs(n)} will be tried again next`, restem: `Re-stemming ${songs(n)}`,
    }[action]);
    poll(true);
  } catch (err) { flash("Couldn't do that: " + err.message); }
}
async function control(action) {
  try { await api("/api/control", { action }); poll(true); }
  catch (err) { flash("Couldn't do that: " + err.message); }
}
async function defaultAction(picked) {
  if (picked.every(r => r.s === "done")) return confirmRestem(picked);
  const again = picked.filter(r => r.s === "failed" || r.s === "skip");
  const todo = picked.filter(r => r.s === "todo");
  if (again.length) await act("retry", again);
  if (todo.length) await act("next", todo);
}
function confirmRestem(picked) {
  const one = picked.length === 1;
  confirmBox("Re-stem", `${one ? `Separate “${esc(picked[0].title)}”` : `Separate these ${nf.format(picked.length)} songs`} again, next in line?<br><br>Until the new stems are done, the phone won't see ${one ? "this song's" : "their"} stems.`,
    () => act("restem", picked));
}
function rowMenu(picked) {
  const has = s => picked.some(r => r.s === s);
  const todoish = picked.filter(r => r.s === "todo");
  const items = [];
  if (todoish.length || has("failed") || has("skip")) items.push({ label: "Stem Next", key: "Enter", bold: true, run: () => defaultAction(picked) });
  if (todoish.length) items.push({ label: "Add to Stem Queue", run: () => act("enqueue", todoish) });
  if (picked.some(r => r.n)) items.push({ label: "Remove from Stem Now Queue", key: "Del", run: () => act("unqueue", picked.filter(r => r.n)) });
  if (has("now")) items.push({ label: "Skip This Song", key: "N", run: () => control("skip") });
  items.push("-");
  if (todoish.length || has("now")) items.push({ label: "Don't Stem", run: () => act("exclude", picked.filter(r => r.s === "todo" || r.s === "now")) });
  if (has("failed") || has("skip")) items.push({ label: has("skip") && !has("failed") ? "Allow Stemming" : "Retry", run: () => act("retry", picked.filter(r => r.s === "failed" || r.s === "skip")) });
  if (has("done")) items.push({ label: "Re-stem…", bold: picked.every(r => r.s === "done"), run: () => confirmRestem(picked.filter(r => r.s === "done")) });
  items.push("-");
  items.push({ label: "Information…", key: "Ctrl+I", disabled: picked.length !== 1, run: () => showInfo(picked[0].r) });
  items.push({ label: "Select All", key: "Ctrl+A", run: () => { list.forEach(r => sel.add(r.r)); paintSel(); } });
  return items;
}

let logOpen = false, logSeq = 0;
function showMessages() { logOpen = true; openDlg("dlg-messages"); pollLog(); }
$("logclear").addEventListener("click", () => { $("log").innerHTML = ""; });
async function pollLog() {
  if (!logOpen) return;
  try {
    const r = await api("/api/log?after=" + logSeq);
    const box = $("log");
    const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
    for (const [seq, line] of r.lines) {
      logSeq = seq;
      const div = document.createElement("div");
      div.textContent = line;
      if (/WARNING|can't|out of GPU/i.test(line)) div.className = "warn";
      else if (/failed|error/i.test(line)) div.className = "err";
      else if (/ page: /.test(line)) div.className = "page";
      else if (/done in/.test(line)) div.className = "done";
      box.appendChild(div);
    }
    while (box.childElementCount > 2000) box.firstChild.remove();
    if (r.lines.length && $("follow").checked && atEnd) box.scrollTop = box.scrollHeight;
  } catch {}
}

  if (ctrl && k.toLowerCase() === "m") { e.preventDefault(); showMessages(); return; }

function draw() {
  if (!S) return;
  const cur = S.current, now = Date.now() / 1000 + skew;
  // Play shows what a press would do, like VLC: pause while running, play while paused.
  $("play").innerHTML = S.paused ? I.play : I.pause;
  $("play").title = S.paused ? "Resume (Space)" : "Pause after this song (Space)";
  $("stop").disabled = $("next").disabled = !cur;
  const fill = $("fill"), knob = $("knob");
  let pos = null, dur = null, speed = null;
  if (cur) {
    dur = cur.dur;
    const elapsed = now - cur.started;
    const loading = cur.pct < 0.05;
    fill.classList.toggle("busy", loading);
    fill.style.width = (cur.pct * 100).toFixed(2) + "%";
    knob.style.left = (cur.pct * 100).toFixed(2) + "%";
    if (dur) pos = dur * cur.pct;
    if (dur && cur.pct > 0.1 && elapsed > 3) speed = dur * cur.pct / elapsed;
    const eta = cur.pct > 0.08 ? elapsed / cur.pct - elapsed : null;
    $("seek").title = `${cur.stage || ""} · ${Math.floor(cur.pct * 100)}% · ${clock(elapsed)} so far${eta != null ? ` · about ${clock(eta)} to go` : ""}`;
    document.title = `${parse(cur.rel).title} - stemd`;
  } else {
    fill.classList.remove("busy");
    fill.style.width = "0"; knob.style.left = "0";
    $("seek").title = "";
    document.title = S.paused ? "Paused - stemd" : "stemd";
  }
  if (speed == null && S.last?.speed) speed = S.last.speed;
  $("tpos").textContent = clock(pos);
  $("tdur").textContent = clock(dur);
  $("sttime").textContent = `${clock(pos)}/${clock(dur)}`;
  $("stspeed").textContent = speed ? speed.toFixed(speed < 10 ? 2 : 1) + "x" : "--";
  const g = S.gpu;
  $("gpu").style.display = g ? "" : "none";
  if (g) {
    drawWedge(g.util);
    $("gpupct").textContent = g.util != null ? Math.round(g.util) + "%" : "--";
    const mem = g.memTotal ? ` · ${(g.memUsed / 1024).toFixed(1)}/${(g.memTotal / 1024).toFixed(0)} GB` : "";
    $("gpu").title = `${g.name}: ${g.util ?? "?"}% busy${mem}${g.temp != null ? ` · ${g.temp}°C` : ""}${g.power != null ? ` · ${Math.round(g.power)} W` : ""}`;
    $("stgpu").textContent = `GPU ${g.util ?? "?"}%${mem}${g.temp != null ? ` · ${g.temp}°C` : ""}`;
  } else $("stgpu").textContent = "";
  drawArt();
  drawStatus();
}

let polling = false;
async function poll(now) {
  if (polling && !now) return;
  polling = true;
  try {
    const s = await api("/api/state");
    skew = s.now - Date.now() / 1000;
    const pctChanged = S?.current?.pct !== s.current?.pct;
    S = s;
    $("offline").style.display = "none";
    document.body.style.opacity = "";
    if (s.rev !== libRev) await loadLibrary();
    else if (pctChanged) paintNow();
    draw();
  } catch (err) {
    $("offline").style.display = "inline";
    $("stmsg").textContent = "";
  } finally {
    polling = false;
  }
}
async function loadLibrary() {
  const r = await api("/api/library?rev=" + libRev);
  if (!r.rows) { libRev = r.rev; return; }
  libRev = r.rev;
  rows = r.rows.map(x => { const p = parse(x.r); return Object.assign(x, p, { lc: x.r.toLowerCase() }); });
  byRel = new Map(rows.map(x => [x.r, x]));
  for (const k of [...sel]) if (!byRel.has(k)) sel.delete(k);
  drawTree();
  const top = $("tbody").scrollTop;
  rebuild();
  $("tbody").scrollTop = top;
}

// ---------------------------------------------------------------- start
if (store.get("sidebar", true) === false) $("sidebar").classList.add("hidden");
if (store.get("statusbar", true) === false) $("statusbar").classList.add("hidden");
if (!VIEWS[view]) view = "queue";
$("q").placeholder = "Search in " + VIEWS[view].name;
drawTree(); drawWedge(0); rebuild(); drawArt();
$("table").focus();
poll();
setInterval(poll, 1000);
setInterval(pollLog, 1000);
</script>
