[project]
name = "stemify"
version = "0.1.0"
description = "Drag-drop stem separation (Demucs + RoFormer) with a 240Hz Material x Aero UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.10",
    "numpy>=2.0",
    "soundfile>=0.13",
    "sounddevice>=0.5",
    "scipy>=1.11",
    "torch==2.14.1",
    "triton-rocm",
    "torchvision",
    "demucs @ git+https://github.com/adefossez/demucs",
    "audio-separator[cpu]>=0.30",
    "audioread",
]

[project.scripts]
stemify = "stemify.app:main"
stemify-worker-cli = "stemify.worker.cli:main"
stemify-player = "stemify.player.app:main"
stemify-mobile = "stemify.mobile.app:main"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torchaudio has no build matching torch 2.14; nothing here needs it.
override-dependencies = ["torchaudio ; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["stemify"]
